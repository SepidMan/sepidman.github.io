version: "3"

vars:
  BUILD_DIR: build
  ELEVENTY_INPUT: src
  PIXI_BIN: $HOME/.pixi/bin/pixi
  RESUME_CLI: '{{.PIXI_BIN}} run --environment resume resume-pipeline'
  RUFF_CLI: '{{.PIXI_BIN}} run --environment lint ruff'
  RESUME_VARIANT: '{{default "cv" .VARIANT}}'

tasks:
  install:
    desc: Install Node and pixi-managed dependencies
    cmds:
      - npm install
      - '{{.PIXI_BIN}} install --all'

  dev:
    desc: Start the Eleventy development server
    cmds:
      - CHOKIDAR_USEPOLLING=1 CHOKIDAR_INTERVAL=250 npx @11ty/eleventy --serve --input={{.ELEVENTY_INPUT}} --output={{.BUILD_DIR}}

  build:
    desc: Build the site and all public resume assets
    cmds:
      - task: build:site
      - task: build:resume

  build:site:
    desc: Build the Eleventy site
    cmds:
      - npx rimraf {{.BUILD_DIR}}
      - npx @11ty/eleventy --input={{.ELEVENTY_INPUT}} --output={{.BUILD_DIR}}

  build:resume:
    desc: Build all public resume assets
    cmds:
      - '{{.RESUME_CLI}} build --all'

  build:resume:all:
    desc: Build every configured RenderCV PDF variant
    cmds:
      - '{{.RESUME_CLI}} build --all'

  build:resume:variant:
    desc: Build a named RenderCV PDF variant
    cmds:
      - '{{.RESUME_CLI}} build --variant {{.RESUME_VARIANT}}'

  validate:resume:
    desc: Validate canonical resume data and resume variant config
    cmds:
      - '{{.RESUME_CLI}} validate'

  lint:resume:
    desc: Lint the Python resume pipeline package with Ruff
    cmds:
      - '{{.RUFF_CLI}} check --config .config/ruff.toml .dev/resume/src/resume_pipeline'

  clean:
    desc: Remove generated build output
    cmds:
      - npx rimraf build cv/generated
