[workspace]
name = "sepidman-github-io"
channels = ["conda-forge"]
platforms = ["linux-64"]

[environments]
rendercv = ["rendercv"]
resume = ["resume"]
lint = {features = ["lint"], no-default-feature = true}

[dependencies]
python = ">=3.12"

[feature.rendercv.pypi-dependencies]
rendercv = { version = "==2.8", extras = ["full"] }

[feature.rendercv.tasks]
rendercv = "rendercv"

[feature.resume.pypi-dependencies]
resume-pipeline = { path = ".dev/resume", editable = true }

[feature.resume.tasks]
resume-pipeline = "resume-pipeline"

[feature.lint.dependencies]
ruff = "==0.15.20"

[feature.lint.tasks]
ruff = "ruff"
