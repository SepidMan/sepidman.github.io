    summary:
      - I am a UI/UX designer with a background in content management and
        customer-facing work, now focused on designing digital experiences that
        are both usable and emotionally aware.
      - I care about information architecture, tone of voice, and visual rhythm
        because the best interfaces do more than function well. They help
        people feel oriented, respected, and confident.
