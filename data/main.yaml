      graphicLabels:
        top: COMPLEXITY TO CLARITY
        bottom: IDEA TO DESIGN
      aside:
        eyebrow: Design lens
        caption: From complexity to clarity!
        note: I like taking crowded, uncertain product experiences and shaping
          them into interfaces that feel calm, legible, and intentional.
      featuredCollection:
        eyebrow: Featured projects
        headline: Selected work that combines clarity, structure, and visual
          tone.
        linkLabel: View all work
      narrative:
        eyebrow: About my practice
        headline: My process is rooted in usability, but shaped by content and
          atmosphere too.
        body: I enjoy designing flows that make complex information feel
          lighter. That means thinking carefully about hierarchy, language, and
          the small visual decisions that help people trust what they are using.
      focusList:
        eyebrow: Currently focused on
        items:
          - Junior UI/UX opportunities
          - Portfolio-ready case studies
          - Calm, accessible digital products
      callToAction:
        eyebrow: Let’s connect
        headline: Looking for a thoughtful designer who cares about clarity and
          human-centered details.
        primary:
          label: Get in touch
          url: /contact/
        secondary:
          label: View resume
          url: /resume/
    about:
      seo:
        title: About
        description: Learn more about Sepideh Mansouri, her design background,
          and what guides her work.
      eyebrow: About
      headline: Designing with calm structure, empathy, and a strong sense of
        visual tone.
      summary:
        - I am a UI/UX designer with a background in content management and
          customer-facing work, now focused on designing digital experiences that
          are both usable and emotionally aware.
        - I care about information architecture, tone of voice, and visual rhythm
          because the best interfaces do more than function well. They help
          people feel oriented, respected, and confident.
      principles:
        - Start from real user intent
        - Reduce friction before adding flourish
        - Design systems that stay coherent as products grow
        - Give every interface a clear point of view
      introCard:
        eyebrow: What guides me
        headline: I want interfaces to feel capable, respectful, and easy to
          move through.
        body: My background in content work and customer-facing roles taught me
          how much trust depends on clarity. In design, I bring that same
          attention to information structure, interaction flow, and the
          emotional tone of each screen.
        principlesEyebrow: Principles
      featureCards:
        eyebrow: Working style
        headline: Research-minded, visually thoughtful, and collaborative.
        cards:
          - eyebrow: Listen
            headline: Understand the real problem
            body: I like starting with user goals and context so the work solves
              what actually matters.
          - eyebrow: Shape
            headline: Turn ideas into usable structure
            body: I organize flows, content, and components so the product
              feels coherent and easier to use.
          - eyebrow: Refine
            headline: Build trust through detail
            body: I care about hierarchy, wording, and visual finish because
              small decisions shape confidence.
